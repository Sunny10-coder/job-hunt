name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forensic-engine/requirements.txt
      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r forensic-engine/requirements.txt
      - name: Run test suite
        working-directory: forensic-engine
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  frontend:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: [engine, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forensic-engine/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r forensic-engine/requirements.txt pyinstaller
      - name: Freeze the Python sidecar
        shell: bash
        run: ./scripts/build_sidecar.sh x86_64-pc-windows-msvc
      - name: Build application and installers
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc
      - name: Smoke-test the frozen engine (migrations, auth, health)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:WFS_DATA_DIR = Join-Path $env:RUNNER_TEMP "wfs-smoke"
          $env:WFS_TOKEN = "ci-smoke-token"
          $engine = "src-tauri/binaries/wfs-engine-x86_64-pc-windows-msvc.exe"
          $proc = Start-Process -FilePath $engine `
            -ArgumentList "serve", "--host", "127.0.0.1", "--port", "8765" `
            -PassThru -RedirectStandardOutput "engine.out.log" `
            -RedirectStandardError "engine.err.log"
          try {
            $deadline = (Get-Date).AddSeconds(90)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 `
                  -Uri "http://127.0.0.1:8765/api/health" `
                  -Headers @{ Authorization = "Bearer $env:WFS_TOKEN" }
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) {
              Get-Content engine.err.log -ErrorAction SilentlyContinue
              throw "engine never answered its authenticated health check"
            }
            $rejected = $false
            try {
              Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 `
                -Uri "http://127.0.0.1:8765/api/health" | Out-Null
            } catch {
              $status = $_.Exception.Response.StatusCode.value__
              if ($status -eq 401) { $rejected = $true }
            }
            if (-not $rejected) { throw "engine health check accepted an unauthenticated request" }
            $db = Join-Path $env:WFS_DATA_DIR "wfs.db"
            if (-not (Test-Path $db)) { throw "the frozen engine did not create its database" }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-forensic-studio-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
