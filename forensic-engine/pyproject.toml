[project]
name = "wfs-engine"
version = "1.0.0"
description = "WhatsApp Forensic Studio AI - local forensic processing engine (sidecar)"
requires-python = ">=3.11"
dependencies = [
  "reportlab>=4.0.0",
  "openpyxl>=3.1.2",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
wfs-engine = "wfs_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wfs_engine*"]

[tool.setuptools.package-data]
wfs_engine = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
