[package]
name = "whatsapp-forensic-studio"
version = "1.0.0"
description = "WhatsApp Forensic Studio AI - local-first forensic workstation"
authors = ["WhatsApp Forensic Studio contributors"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[[bin]]
name = "whatsapp-forensic-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
keyring = { version = "3", default-features = false, features = [
  "windows-native",
  "apple-native",
  "sync-secret-service",
  "crypto-rust",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
